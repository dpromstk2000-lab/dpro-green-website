name: DPRO GREEN Blog Mobile Navigation Final R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply mobile navigation
        shell: python
        env:
          PATCH_B64: ""
        run: |
          import os, base64
          code=base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8")
          exec(compile(code,"green_blog_mobile_navigation_final.py","exec"))

      - name: Validate
        shell: bash
        run: |
          node --check green-blog-public-r1.js
          node --check config.js
          grep -q "data-gb-menu-button" blog.html
          grep -q "data-gb-menu-button" blog-post.html
          grep -q "gb-mobile-cta" blog.html
          grep -q "gb-mobile-cta" blog-post.html
          grep -q "ブログ一覧へ" green-blog-public-r1.js
          grep -q "initBlogMobileNavigation" green-blog-public-r1.js
          grep -q "GREEN BLOG MOBILE NAVIGATION FINAL R1" green-blog-public-r1.css
          grep -q "GREEN-BLOG-MOBILE-NAV-FINAL-R1-20261007" blog.html
          grep -q "GREEN-BLOG-MOBILE-NAV-FINAL-R1-20261007" blog-post.html

      - name: Remove installer workflow
        shell: bash
        run: rm -f .github/workflows/green-blog-mobile-navigation-final-r1.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Unify GREEN blog mobile navigation"
          git push
