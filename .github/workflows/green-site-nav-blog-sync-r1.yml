name: DPRO GREEN Site Nav Blog Sync R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync blog links across site navigation
        shell: python
        env:
          PATCH_B64: ""
        run: |
          import os, base64
          code = base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8")
          exec(compile(code, "green_site_nav_blog_sync.py", "exec"))

      - name: Validate
        shell: bash
        run: |
          grep -q 'href="blog.html">ブログ' index.html
          grep -q 'href="blog.html">ブログ' line.html
          grep -q 'href="blog.html">ブログ' contact.html
          grep -q 'href="blog.html">ブログ' service.html
          grep -q 'href="blog.html">ブログ' plant-guide.html
          grep -q 'href="blog.html">ブログ' cases.html
          grep -q 'href="blog.html">ブログ' flow.html
          grep -q 'href="blog.html">ブログ' about.html
          grep -q 'href="blog.html">ブログ' faq.html

      - name: Remove installer workflow
        shell: bash
        run: rm -f .github/workflows/green-site-nav-blog-sync-r1.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Sync blog links across GREEN site navigation"
          git push
