name: DPRO GREEN Kasuya Moving Hero R2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply original moving hero
        shell: python
        env:
          PATCH_B64: ""
        run: |
          import os, base64
          code=base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8")
          exec(compile(code,"green_kasuya_moving_hero_r2.py","exec"))

      - name: Validate
        shell: bash
        run: |
          node --check kasuya-brushup-preview.js
          grep -q 'ORIGINAL MOVING HERO R2' kasuya-hero-clarity-v1.css
          grep -q 'dpro-kasuya-hero-a' kasuya-hero-clarity-v1.css
          grep -q 'dpro-kasuya-hero-b' kasuya-hero-clarity-v1.css
          grep -q 'dpro-kasuya-hero-c' kasuya-hero-clarity-v1.css
          grep -q 'HERO_INTERVAL_MS=7500' kasuya-brushup-preview.js
          grep -q 'HERO-MOTION-R2-20261009' index.html
          grep -q 'fetchpriority="high"' index.html
          grep -q 'prefers-reduced-motion:reduce' kasuya-hero-clarity-v1.css

      - name: Remove installer workflow
        shell: bash
        run: rm -f .github/workflows/green-kasuya-moving-hero-r2.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Upgrade Kasuya hero motion R2"
          git push
