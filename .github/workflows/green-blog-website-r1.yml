name: DPRO GREEN Website Blog R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write public blog assets
        shell: python
        env:
          BLOG_JS_B64: ""
          BLOG_CSS_B64: ""
          BLOG_HTML_B64: ""
          BLOG_POST_HTML_B64: ""
          BLOG_LOADER_B64: ""
        run: |
          import os, base64, re
          from pathlib import Path

          mapping = {
              "green-blog-public-r1.js": "BLOG_JS_B64",
              "green-blog-public-r1.css": "BLOG_CSS_B64",
              "blog.html": "BLOG_HTML_B64",
              "blog-post.html": "BLOG_POST_HTML_B64",
          }
          for path, key in mapping.items():
              Path(path).write_bytes(base64.b64decode(os.environ[key]))

          config = Path("config.js")
          text = config.read_text(encoding="utf-8")
          marker = "GREEN-BLOG-PUBLIC-R1-20261006"
          if marker not in text:
              text += "\n" + base64.b64decode(os.environ["BLOG_LOADER_B64"]).decode("utf-8") + "\n"
          config.write_text(text, encoding="utf-8")

          index = Path("index.html")
          h = index.read_text(encoding="utf-8")
          h = re.sub(r'<script src="config\.js(?:\?[^"]*)?"></script>', '<script src="config.js?v=GREEN-BLOG-PUBLIC-R1-20261006"></script>', h, count=1)
          index.write_text(h, encoding="utf-8")

          sitemap = Path("sitemap.xml")
          s = sitemap.read_text(encoding="utf-8")
          loc = "https://dpromstk2000-lab.github.io/dpro-green-website/blog.html"
          if loc not in s:
              entry = '  <url>\n    <loc>' + loc + '</loc>\n    <lastmod>2026-10-06</lastmod>\n  </url>\n'
              s = s.replace("</urlset>", entry + "</urlset>")
          sitemap.write_text(s, encoding="utf-8")

      - name: Validate
        shell: bash
        run: |
          node --check green-blog-public-r1.js
          grep -q 'GREEN-BLOG-PUBLIC-R1-20261006' config.js
          grep -q 'GREEN-BLOG-PUBLIC-R1-20261006' index.html
          grep -q 'blog.html' sitemap.xml
          grep -q 'data-blog-list' blog.html
          grep -q 'data-blog-detail' blog-post.html

      - name: Remove installer workflow
        shell: bash
        run: rm -f .github/workflows/green-blog-website-r1.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add GREEN website blog R1"
          git push
