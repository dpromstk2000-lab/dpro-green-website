name: DPRO GREEN Blog Public Final R1.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final blog UX
        shell: python
        env:
          PATCH_B64: ""
        run: |
          import os, base64
          code=base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8")
          exec(compile(code,"green_blog_public_final_patch.py","exec"))

      - name: Validate
        shell: bash
        run: |
          node --check green-blog-public-r1.js
          node --check config.js
          grep -q "PAGE_SIZE=9" green-blog-public-r1.js
          grep -q "data-blog-more" blog.html
          grep -q "もっと見る" blog.html
          grep -q "FREE CONSULTATION" green-blog-public-r1.js
          grep -q "無料相談・見積り" green-blog-public-r1.js
          grep -q "LINEで相談" green-blog-public-r1.js
          grep -q "slice(0,3)" green-blog-public-r1.js
          grep -q "GREEN BLOG PUBLIC FINAL R1.1" green-blog-public-r1.css
          grep -q "GREEN-BLOG-PUBLIC-R1.1-FINAL-20261006" config.js
          grep -q "GREEN-BLOG-PUBLIC-R1.1-FINAL-20261006" index.html
          grep -q "GREEN-BLOG-PUBLIC-R1.1-FINAL-20261006" blog.html
          grep -q "GREEN-BLOG-PUBLIC-R1.1-FINAL-20261006" blog-post.html

      - name: Remove installer workflow
        shell: bash
        run: rm -f .github/workflows/green-blog-public-final-r1-1.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Finalize GREEN blog public UX R1.1"
          git push
