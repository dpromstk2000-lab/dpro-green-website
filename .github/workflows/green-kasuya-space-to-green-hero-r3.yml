name: DPRO GREEN Kasuya Space to Green Hero R3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply SPACE to GREEN hero R3
        shell: python
        env:
          PATCH_B64: ""
        run: |
          import os,base64
          code=base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8")
          exec(compile(code,"green_kasuya_space_to_green_r3.py","exec"))

      - name: Validate
        shell: bash
        run: |
          node --check kasuya-brushup-preview.js
          grep -q 'data-hero-green-reveal' index.html
          grep -q 'SPACE TO GREEN HERO R3' kasuya-hero-clarity-v1.css
          grep -q 'dpro-green-reveal' kasuya-hero-clarity-v1.css
          grep -q 'dpro-space-base-color' kasuya-hero-clarity-v1.css
          grep -q 'HERO_INTRO_MS=4300' kasuya-brushup-preview.js
          grep -q 'HERO-SPACE-GREEN-R3-20261009' index.html

      - name: Remove installer workflow
        shell: bash
        run: rm -f .github/workflows/green-kasuya-space-to-green-hero-r3.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Kasuya SPACE to GREEN hero R3"
          git push
