<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="refresh" content="3;url=./">
  <title>公開環境検査完了｜DPRO GREEN</title>
  <style>
    :root{--green:#0d3b2e;--pale:#f3f7ef;--line:#dce6d6}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      background:var(--pale);color:#17352b;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
    main{width:min(680px,100%);padding:42px 30px;text-align:center;background:#fff;
      border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 50px rgba(13,59,46,.10)}
    .mark{width:56px;height:56px;margin:0 auto 18px;display:grid;place-items:center;
      border-radius:50%;background:#e4f3dd;color:var(--green);font-size:30px;font-weight:800}
    h1{margin:0 0 14px;font-size:clamp(26px,5vw,40px);line-height:1.35}
    p{margin:0 0 26px;color:#52645d;line-height:1.9}
    a{display:inline-block;padding:14px 22px;border-radius:999px;background:var(--green);
      color:#fff;text-decoration:none;font-weight:700}
    small{display:block;margin-top:18px;color:#75847e}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>公開環境検査は完了しました</h1>
    <p>検査用の通信機能は無効化されています。<br>まもなくホームページへ移動します。</p>
    <a href="./">ホームページへ戻る</a>
    <small>WEB-GREEN-6-R3 / production cleanup</small>
  </main>
</body>
</html>
