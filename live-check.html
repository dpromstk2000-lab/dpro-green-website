<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="refresh" content="3;url=./index.html">
  <title>公開環境検査完了｜DPRO GREEN</title>
  <style>
    :root{color-scheme:light;--green:#0d3b2e;--pale:#f3f7ef;--line:#dce6d6}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
      color:#17352b;background:var(--pale)}
    main{width:min(680px,100%);padding:42px 30px;border:1px solid var(--line);
      border-radius:24px;background:#fff;box-shadow:0 18px 50px rgba(13,59,46,.10);text-align:center}
    .mark{width:54px;height:54px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
      background:#e4f3dd;color:var(--green);font-size:28px;font-weight:800}
    h1{margin:0 0 14px;font-size:clamp(26px,5vw,40px);line-height:1.35}
    p{margin:0 0 26px;line-height:1.9;color:#52645d}
    a{display:inline-block;padding:14px 22px;border-radius:999px;background:var(--green);
      color:#fff;text-decoration:none;font-weight:700}
    small{display:block;margin-top:18px;color:#75847e}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>公開環境検査は完了しました</h1>
    <p>検査用の送信機能は無効化されています。<br>まもなくホームページへ移動します。</p>
    <a href="./index.html">ホームページへ戻る</a>
    <small>WEB-GREEN-4-R2 / production cleanup</small>
  </main>
</body>
</html>
